# fly.toml app configuration file generated for stablescan-bot on 2026-11-26T11:05:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'stablescan-bot'
primary_region = 'lhr'

[build]
[env]
  NODE_ENV = 'production'
  PAPER_MODE = 'true'
  POSITION_SIZE = '100'

[processes]
  app = 'node bot.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
